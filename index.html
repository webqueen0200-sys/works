<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2026 업무관리</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark">▤</span>
    <div class="brand-text">
      <h1>2026 업무관리</h1>
    </div>
  </div>
  <div id="apiModeLabel" class="api-mode"></div>
</header>

<nav id="monthTabs" class="month-tabs"></nav>

<div class="toolbar">
  <div class="toolbar-left">
    <button id="btnDashboardView" class="tab-btn active">대시보드</button>
    <button id="btnSheetView" class="tab-btn">업무현황</button>
    <button id="btnSummaryView" class="tab-btn">요약</button>
  </div>
  <div class="toolbar-right">
    <div id="sheetToolsGroup" class="sheet-tools" style="display:none">
      <input id="searchInput" type="text" placeholder="업무명 · 업무상세 · 티켓번호 검색" />
      <span id="rowCount" class="row-count"></span>
      <button id="btnAddRow" class="btn btn-primary">+ 행 추가</button>
      <button id="btnExport" class="btn btn-ghost">CSV 내보내기</button>
    </div>
    <button id="btnSettings" class="btn btn-ghost">기준 설정</button>
  </div>
</div>

<main>
  <section id="dashboardPanel" class="panel">
    <div class="dash-header">
      <h2 id="dashTitle">대시보드</h2>
      <button id="btnDashRefresh" class="btn btn-ghost">새로고침</button>
    </div>
    <div id="dashKpis" class="dash-kpis"></div>
    <div class="dash-metrics">
      <div id="dashStatusCard" class="summary-card"></div>
      <div id="dashCategoryCard" class="summary-card"></div>
      <div id="dashMMCard" class="summary-card"></div>
      <div id="dashRequesterCard" class="summary-card"></div>
    </div>
    <div class="dash-lists">
      <div id="dashUrgentCard" class="summary-card"></div>
      <div id="dashDueCard" class="summary-card"></div>
      <div id="dashNextWeekCard" class="summary-card"></div>
    </div>
  </section>

  <section id="sheetPanel" class="panel" style="display:none">
    <div class="table-scroll">
      <table id="sheetTable">
        <thead>
          <tr id="theadGroup"></tr>
          <tr id="theadCols"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section id="summaryPanel" class="panel" style="display:none">
    <div class="summary-grid">
      <div id="countTable" class="summary-card"></div>
      <div id="mmTable" class="summary-card"></div>
      <div id="detailMMTable" class="summary-card wide"></div>
    </div>
  </section>
</main>

<div id="settingsModal" class="modal">
  <div class="modal-box">
    <h2>기준 설정</h2>
    <div id="settingsForm"></div>
    <div class="modal-actions">
      <button id="btnSettingsClose" class="btn btn-ghost">닫기</button>
      <button id="btnSettingsSave" class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
